<title id="title">type-clipboard を起こした直後</title>
<desc id="desc">type-clipboard を起こした直後の画面。メモ帳・ブラウザの VNC のコンソール (vm02)・仮想マシン接続 (vm01) の窓の右に、type-clipboard の窓が出る。打つ先はまだ無く、プレビューの欄は空のまま。</desc>
