.c-blue{fill:#2563eb}.c-green{fill:#15803d}.c-amber{fill:#b45309}
.tb{transform-box:fill-box;transform-origin:50% 50%}.tl{transform-box:fill-box;transform-origin:0 50%}
.blink{animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}
@keyframes a1{0%{opacity:0;transform:translateY(14px);animation-timing-function:step-end}12.5%{opacity:0;transform:translateY(14px);animation-timing-function:ease-out}21.25%{opacity:1;transform:translateY(0);animation-timing-function:step-end}100%{opacity:1;transform:translateY(0)}}
.a1{opacity:1;transform:translateY(0);animation:a1 4s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
